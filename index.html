<style>
  /* ===== Tema CLARO (padrão) ===== */
  :root{
    --eleve-azul:#127DCB; --eleve-azul-esc:#0B4E83; --eleve-preto:#231F20;
    --bg:#F4F7FB; --surface:#FFFFFF; --side:#FFFFFF; --side-hover:#EEF4FB; --side-border:#E3E8EF;
    --txt:#231F20; --muted:#5F6B7A; --border:#DCE3EC; --logo-txt:#231F20;
    --bar:#FFFFFF; --bar-txt:#231F20; --btn-bg:#F4F7FB; --btn-border:#DCE3EC;
    --shadow:rgba(11,78,131,.12); --frame-bg:#FFFFFF;
  }
  /* ===== Tema ESCURO ===== */
  [data-theme="dark"]{
    --bg:#15181D; --surface:#1E2228; --side:#1A1D22; --side-hover:#262B33; --side-border:#2C323B;
    --txt:#E9ECEF; --muted:#9AA4B2; --border:#2C323B; --logo-txt:#FFFFFF;
    --bar:#1E2228; --bar-txt:#E9ECEF; --btn-bg:#262B33; --btn-border:#353C46;
    --shadow:rgba(0,0,0,.35); --frame-bg:#15181D;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt)}
  body,aside,.bar,.card,.hero,.btn,.item{transition:background-color .2s,color .2s,border-color .2s}
  .app{display:flex;height:100vh;overflow:hidden}

  /* Menu lateral */
  aside{width:250px;background:var(--side);color:var(--txt);border-right:1px solid var(--side-border);display:flex;flex-direction:column;transition:width .2s,background-color .2s}
  aside.mini{width:68px}
  .brand{display:flex;align-items:center;justify-content:center;padding:18px 16px;border-bottom:1px solid var(--side-border);min-height:72px}
  .brand .full{width:100%;max-width:200px;height:auto;color:var(--logo-txt)}
  .brand .sym{width:34px;height:34px;display:none}
  aside.mini .brand .full{display:none}
  aside.mini .brand .sym{display:block}
  aside.mini .lbl{display:none}
  nav{flex:1;padding:12px 10px;overflow-y:auto}
  .item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;margin-bottom:4px;border:none;border-radius:8px;
        background:transparent;color:var(--muted);font-size:14px;cursor:pointer;text-align:left;white-space:nowrap}
  .item:hover{background:var(--side-hover);color:var(--txt)}
  .item.active{background:var(--eleve-azul);color:#fff}
  .item .ic{font-size:18px;width:22px;text-align:center;flex-shrink:0}
  .item .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:#22c55e;display:none}
  .item.loaded .dot{display:block}
  .item.active .dot{background:#fff}
  aside.mini .item .dot{display:none}
  .foot{padding:10px;border-top:1px solid var(--side-border)}

  /* Área principal */
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  .bar{height:52px;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--bar);color:var(--bar-txt);
       border-bottom:3px solid var(--eleve-azul)}
  .bar h1{font-size:15px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.3px}
  .btn{border:1px solid var(--btn-border);background:var(--btn-bg);color:var(--bar-txt);border-radius:6px;padding:6px 11px;font-size:13px;cursor:pointer}
  .btn:hover{border-color:var(--eleve-azul);color:var(--eleve-azul)}
  .frames{flex:1;position:relative;background:var(--frame-bg)}
  .frames iframe{position:absolute;inset:0;width:100%;height:100%;border:none;display:none;background:#fff}
  .frames iframe.show{display:block}

  /* Tela inicial */
  .home{position:absolute;inset:0;background:var(--bg);overflow:auto;display:none}
  .home.show{display:block}
  .hero{background:var(--surface);border-bottom:1px solid var(--border);padding:32px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
  .hero-logo{width:100%;max-width:380px;height:auto;color:var(--logo-txt)}
  .hero p{color:var(--muted);font-size:14px}
  .wrap{padding:28px 32px}
  .wrap h2{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--eleve-azul);margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
  .card{background:var(--surface);border:1px solid var(--border);border-top:4px solid var(--eleve-azul);border-radius:10px;padding:20px;cursor:pointer}
  .card:hover{border-top-color:var(--eleve-azul-esc);box-shadow:0 8px 22px var(--shadow);transform:translateY(-2px)}
  .card .ic{font-size:28px;margin-bottom:10px}
  .card b{display:block;font-size:16px;margin-bottom:4px;color:var(--txt)}
  .card small{color:var(--muted)}

  @media (max-width:760px){
    aside{position:fixed;z-index:20;height:100%;left:0;top:0;transform:translateX(-100%);transition:transform .2s;width:250px}
    aside.open{transform:none}
    aside.mini{width:250px}
    aside.mini .brand .full{display:block}
    aside.mini .brand .sym{display:none}
    aside.mini .lbl{display:inline}
    #btnMenu{display:inline-block!important}
    #btnMini{display:none}
    #btnReload .t,#btnNova .t{display:none}
    .hero{padding:24px 16px}
    .wrap{padding:20px 16px}
  }
</style>
</head>

<script>
// ===== Lista de sistemas (edite aqui para adicionar/remover) =====
const SISTEMAS = [
  { id:'financeiro', nome:'Financeiro',            icone:'💰', desc:'Gestão financeira, DRE e fluxo de caixa', url:'https://elevecap2025-stack.github.io/eleve/' },
  { id:'pcp',        nome:'PCP / Planejamento',    icone:'🏭', desc:'Planejamento e controle da produção',      url:'https://elevecap2025-stack.github.io/ppcpplanejamento/' },
  { id:'compras',    nome:'Compras',               icone:'🛒', desc:'Gestão de compras',                        url:'https://elevecap2025-stack.github.io/compras/' },
  { id:'custos',     nome:'Sistema de Custos',     icone:'📊', desc:'Custos e formação de preço',               url:'https://elevecap2025-stack.github.io/sistemadecustos/' },
  { id:'followup',   nome:'Follow-up / Plano de Ação', icone:'✅', desc:'Follow-up e Plano de Ação 5W2H',      url:'https://elevecap2025-stack.github.io/followupeleve/' },
];

const nav = document.getElementById('nav'), grid = document.getElementById('grid'),
      frames = document.getElementById('frames'), home = document.getElementById('home'),
      titulo = document.getElementById('titulo'), side = document.getElementById('side');
const iframes = {};
let atual = null;

// Monta menu e cards
nav.appendChild(criarItem({id:'home', nome:'Início', icone:'🏠'}));
SISTEMAS.forEach(s => {
  nav.appendChild(criarItem(s));
  const c = document.createElement('div');
  c.className = 'card';
  c.innerHTML = `<div class="ic">${s.icone}</div><b>${s.nome}</b><small>${s.desc}</small>`;
  c.onclick = () => abrir(s.id);
  grid.appendChild(c);
});

function criarItem(s){
  const b = document.createElement('button');
  b.className = 'item'; b.dataset.id = s.id; b.title = s.nome;
  b.innerHTML = `<span class="ic">${s.icone}</span><span class="lbl">${s.nome}</span><span class="dot"></span>`;
  b.onclick = () => abrir(s.id);
  return b;
}

// Abre um sistema (carrega só na primeira vez, depois mantém em memória)
function abrir(id){
  atual = id;
  document.querySelectorAll('.item').forEach(i => i.classList.toggle('active', i.dataset.id === id));
  Object.values(iframes).forEach(f => f.classList.remove('show'));
  side.classList.remove('open');

  if(id === 'home'){
    home.classList.add('show'); titulo.textContent = 'Início';
  } else {
    home.classList.remove('show');
    const s = SISTEMAS.find(x => x.id === id);
    if(!iframes[id]){
      const f = document.createElement('iframe');
      f.src = s.url; f.title = s.nome;
      f.setAttribute('allow','clipboard-read; clipboard-write; fullscreen');
      frames.appendChild(f);
      iframes[id] = f;
      document.querySelector(`.item[data-id="${id}"]`).classList.add('loaded');
    }
    iframes[id].classList.add('show');
    titulo.textContent = s.nome;
  }
  history.replaceState(null, '', '#' + id);
}

document.getElementById('btnReload').onclick = () => {
  if(atual && iframes[atual]) iframes[atual].src = SISTEMAS.find(s => s.id === atual).url;
};
document.getElementById('btnNova').onclick = () => {
  const s = SISTEMAS.find(x => x.id === atual);
  if(s) window.open(s.url, '_blank');
};
// Tema claro/escuro (claro é o padrão; a escolha fica salva no navegador)
const btnTema = document.getElementById('btnTema');
function aplicarTema(t){
  if(t === 'dark') document.documentElement.setAttribute('data-theme','dark');
  else document.documentElement.removeAttribute('data-theme');
  btnTema.textContent = t === 'dark' ? '☀️' : '🌙';
  btnTema.title = t === 'dark' ? 'Mudar para tema claro' : 'Mudar para tema escuro';
}
let tema = 'light';
try { tema = localStorage.getItem('portalEleveTema') || 'light'; } catch(e){}
aplicarTema(tema);
btnTema.onclick = () => {
  tema = tema === 'dark' ? 'light' : 'dark';
  aplicarTema(tema);
  try { localStorage.setItem('portalEleveTema', tema); } catch(e){}
};

document.getElementById('btnMini').onclick = () => side.classList.toggle('mini');
document.getElementById('btnMenu').onclick = () => side.classList.toggle('open');

// Abre o sistema indicado na URL (#financeiro, #pcp...) ou a tela inicial
const inicial = location.hash.slice(1);
abrir(SISTEMAS.some(s => s.id === inicial) ? inicial : 'home');
</script>
