<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portal Eleve</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%22341.3%20128.8%20213.5%20222.1%22%3E%3Cpath%20fill%3D%22%23127DCB%22%20d%3D%22M%20411.44%20198.08%20L%20411.44%20156.84%20L%20343.26%20179.09%20L%20343.26%20220.33%20Z%20M%20411.44%20198.08%20%22/%3E%3Cpath%20fill%3D%22%23127DCB%22%20d%3D%22M%20537.57%20177.07%20L%20552.77%20130.79%20L%20437.26%20169.02%20L%20437.26%20210.26%20Z%20M%20537.57%20177.07%20%22/%3E%3Cpath%20fill%3D%22%230B4E83%22%20d%3D%22M%20437.26%20210.26%20L%20437.26%20169.02%20L%20411.44%20156.84%20L%20411.44%20198.08%20Z%20M%20437.26%20210.26%20%22/%3E%3Cpath%20fill%3D%22%23127DCB%22%20d%3D%22M%20411.44%20221.14%20L%20343.26%20243.39%20L%20343.26%20284.63%20L%20411.44%20262.38%20Z%20M%20411.44%20221.14%20%22/%3E%3Cpath%20fill%3D%22%23127DCB%22%20d%3D%22M%20437.26%20274.56%20L%20513.87%20249.21%20L%20529.07%20202.93%20L%20437.26%20233.32%20Z%20M%20437.26%20274.56%20%22/%3E%3Cpath%20fill%3D%22%230B4E83%22%20d%3D%22M%20437.26%20274.56%20L%20437.26%20233.32%20L%20411.44%20221.14%20L%20411.44%20262.38%20Z%20M%20437.26%20274.56%20%22/%3E%3Cpath%20fill%3D%22%23127DCB%22%20d%3D%22M%20343.26%20307.68%20L%20343.26%20348.92%20L%20411.44%20326.67%20L%20411.44%20285.43%20Z%20M%20343.26%20307.68%20%22/%3E%3Cpath%20fill%3D%22%23127DCB%22%20d%3D%22M%20437.26%20297.61%20L%20437.26%20338.85%20L%20490.16%20321.34%20L%20505.37%20275.07%20Z%20M%20437.26%20297.61%20%22/%3E%3Cpath%20fill%3D%22%230B4E83%22%20d%3D%22M%20411.44%20285.43%20L%20411.44%20326.67%20L%20437.26%20338.85%20L%20437.26%20297.61%20Z%20M%20411.44%20285.43%20%22/%3E%3C/svg%3E">
<style>
  /* ===== Tema CLARO (padrão) ===== */
  :root{
    --eleve-azul:#127DCB; --eleve-azul-esc:#0B4E83; --eleve-preto:#231F20;
    --bg:#F4F7FB; --surface:#FFFFFF; --side:#FFFFFF; --side-hover:#EEF4FB; --side-border:#E3E8EF;
    --txt:#231F20; --muted:#5F6B7A; --border:#DCE3EC; --logo-txt:#231F20;
    --bar:#FFFFFF; --bar-txt:#231F20; --btn-bg:#F4F7FB; --btn-border:#DCE3EC;
    --shadow:rgba(16,40,70,.08); --frame-bg:#FFFFFF; --active-bg:#EAF3FC;
  }
  /* ===== Tema ESCURO ===== */
  [data-theme="dark"]{
    --bg:#15181D; --surface:#1E2228; --side:#1A1D22; --side-hover:#262B33; --side-border:#2C323B;
    --txt:#E9ECEF; --muted:#9AA4B2; --border:#2C323B; --logo-txt:#FFFFFF;
    --bar:#1E2228; --bar-txt:#E9ECEF; --btn-bg:#262B33; --btn-border:#353C46;
    --shadow:rgba(0,0,0,.35); --frame-bg:#15181D; --active-bg:rgba(18,125,203,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;font-family:Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt)}
  body,aside,.bar,.card,.hero,.btn,.item{transition:background-color .2s,color .2s,border-color .2s}
  .app{display:flex;height:100vh;overflow:hidden}

  /* Menu lateral */
  aside{width:250px;background:var(--side);color:var(--txt);border-right:1px solid var(--side-border);display:flex;flex-direction:column;transition:width .2s,background-color .2s}
  aside.mini{width:68px}
  .brand{display:flex;align-items:center;justify-content:center;padding:18px 16px;border-bottom:1px solid var(--side-border);min-height:72px}
  .brand .full{width:100%;max-width:200px;height:auto;color:var(--logo-txt)}
  .brand .sym{width:34px;height:34px;display:none}
  aside.mini .brand .full{display:none}
  aside.mini .brand .sym{display:block}
  aside.mini .lbl{display:none}
  nav{flex:1;padding:12px 10px;overflow-y:auto}
  .item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;margin-bottom:4px;border:none;border-radius:8px;
        background:transparent;color:var(--muted);font-size:14px;cursor:pointer;text-align:left;white-space:nowrap}
  .item:hover{background:var(--side-hover);color:var(--txt)}
  .item.active{background:var(--eleve-azul);color:#fff}
  .item .ic{font-size:18px;width:22px;text-align:center;flex-shrink:0}
  .item .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:#22c55e;display:none}
  .item.loaded .dot{display:block}
  .item.active .dot{background:#fff}
  aside.mini .item .dot{display:none}
  .foot{padding:10px;border-top:1px solid var(--side-border)}

  /* Área principal */
  main{flex:1;display:flex;flex-direction:column;min-width:0}
  .bar{height:52px;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--bar);color:var(--bar-txt);
       border-bottom:3px solid var(--eleve-azul)}
  .bar h1{font-size:15px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.3px}
  .btn{border:1px solid var(--btn-border);background:var(--btn-bg);color:var(--bar-txt);border-radius:6px;padding:6px 11px;font-size:13px;cursor:pointer}
  .btn:hover{border-color:var(--eleve-azul);color:var(--eleve-azul)}
  .frames{flex:1;position:relative;background:var(--frame-bg)}
  .frames iframe{position:absolute;inset:0;width:100%;height:100%;border:none;display:none;background:#fff}
  .frames iframe.show{display:block}

  /* Tela inicial */
  .home{position:absolute;inset:0;background:var(--bg);overflow:auto;display:none}
  .home.show{display:block}
  .home:focus,.home:focus-visible{outline:none}
  .hero{background:var(--surface);border-bottom:1px solid var(--border);padding:32px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
  .hero-logo{width:100%;max-width:380px;height:auto;color:var(--logo-txt)}
  .hero p{color:var(--muted);font-size:14px}
  .wrap{padding:28px 32px}
  .wrap h2{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--eleve-azul);margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
  .card{background:var(--surface);border:1px solid var(--border);border-top:4px solid var(--eleve-azul);border-radius:10px;padding:20px;cursor:pointer}
  .card:hover{border-top-color:var(--eleve-azul-esc);box-shadow:0 8px 22px var(--shadow);transform:translateY(-2px)}
  .card .ic{font-size:28px;margin-bottom:10px}
  .card b{display:block;font-size:16px;margin-bottom:4px;color:var(--txt)}
  .card small{color:var(--muted)}

  @media (max-width:760px){
    aside{position:fixed;z-index:20;height:100%;left:0;top:0;transform:translateX(-100%);transition:transform .2s;width:250px}
    aside.open{transform:none}
    aside.mini{width:250px}
    aside.mini .brand .full{display:block}
    aside.mini .brand .sym{display:none}
    aside.mini .lbl{display:inline}
    #btnMenu{display:inline-block!important}
    #btnMini{display:none}
    #btnReload .t,#btnNova .t{display:none}
    .hero{padding:24px 16px}
    .wrap{padding:20px 16px}
  }

  /* ===== Acabamento profissional ===== */
  body{font-family:"Inter","Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  aside{width:256px}
  .brand{min-height:76px;padding:20px 22px;justify-content:flex-start}
  .brand .full{max-width:170px}
  aside.mini .brand{justify-content:center;padding:20px 10px}
  nav{padding:14px 12px}
  .sec{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);opacity:.8;padding:16px 12px 8px}
  .item{position:relative;gap:12px;padding:10px 12px;margin-bottom:2px;border-radius:7px;font-size:14px;font-weight:500;color:var(--muted)}
  .item .ic{width:20px;height:20px;font-size:0;display:flex}
  .item .ic svg{width:20px;height:20px}
  .item:hover{background:var(--side-hover);color:var(--txt)}
  .item.active{background:var(--active-bg);color:var(--eleve-azul);font-weight:600}
  .item.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--eleve-azul)}
  .item .dot{width:6px;height:6px;background:#22c55e}
  .item.active .dot{background:#22c55e}
  aside.mini .item{justify-content:center}
  aside.mini .sec{display:none}

  .bar{height:60px;padding:0 20px;gap:10px;border-bottom:1px solid var(--side-border);box-shadow:0 1px 0 var(--side-border)}
  .bar::after{content:none}
  .ttl{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
  .ttl small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .ttl h1{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border-radius:7px;font-size:13px;font-weight:500;background:var(--surface)}
  .btn svg{width:16px;height:16px}
  .btn.ico{width:34px;padding:0;justify-content:center}
  .btn:hover{border-color:var(--eleve-azul);color:var(--eleve-azul);background:var(--active-bg)}
  .frames{border-top:3px solid var(--eleve-azul)}

  .hero{padding:36px 32px 30px;gap:10px;border-bottom:1px solid var(--border)}
  .hero-logo{max-width:320px}
  .hero p{font-size:13px;text-transform:uppercase;letter-spacing:1.6px}
  .wrap{padding:30px 32px;max-width:1280px;margin:0 auto}
  .wrap h2{font-size:12px;font-weight:600;letter-spacing:1.3px;color:var(--muted);margin-bottom:16px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px}
  .card{display:flex;flex-direction:column;border:1px solid var(--border);border-top:1px solid var(--border);border-radius:12px;padding:22px;
        box-shadow:0 1px 2px var(--shadow);transition:border-color .15s,box-shadow .15s,transform .15s}
  .card:hover{border-color:var(--eleve-azul);border-top-color:var(--eleve-azul);box-shadow:0 10px 26px var(--shadow);transform:translateY(-2px)}
  .cic{width:44px;height:44px;border-radius:10px;background:var(--active-bg);color:var(--eleve-azul);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
  .cic svg{width:22px;height:22px}
  .card b{font-size:15px;font-weight:600;margin-bottom:5px}
  .card small{font-size:13px;line-height:1.45;flex:1}
  .go{margin-top:18px;padding-top:14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--eleve-azul)}
  .go svg{width:15px;height:15px;transition:transform .15s}
  .card:hover .go svg{transform:translateX(3px)}
  @media (max-width:760px){
    .bar{padding:0 12px}
    .btn .t{display:none}
    .btn{width:34px;padding:0;justify-content:center}
  }

  /* ===== Indicadores de desempenho ===== */
  .view{position:absolute;inset:0;overflow:auto;background:var(--bg);display:none}
  .view.show{display:block}
  .view:focus{outline:none}
  .vwrap{padding:26px 30px 40px;max-width:1440px;margin:0 auto}
  .vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
  .vtitle{font-size:20px;font-weight:700;letter-spacing:.2px}
  .vsub{color:var(--muted);font-size:13px;margin-top:4px}
  .vacts{display:flex;gap:8px;flex-wrap:wrap}
  .btn.pri{background:var(--eleve-azul);border-color:var(--eleve-azul);color:#fff}
  .btn.pri:hover{background:var(--eleve-azul-esc);border-color:var(--eleve-azul-esc);color:#fff}
  .btn.dng:hover{border-color:#d03b3b;color:#d03b3b;background:rgba(208,59,59,.08)}
  .tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
  .tools .sp{flex:1}
  .sel{height:34px;border:1px solid var(--btn-border);background:var(--surface);color:var(--txt);border-radius:7px;padding:0 10px;font:inherit;font-size:13px;cursor:pointer}
  .sel:focus,.num:focus,.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--eleve-azul);outline-offset:-1px;border-color:var(--eleve-azul)}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{height:32px;padding:0 13px;border-radius:16px;border:1px solid var(--btn-border);background:var(--surface);color:var(--muted);font:inherit;font-size:13px;font-weight:500;cursor:pointer}
  .chip:hover{color:var(--txt);border-color:var(--eleve-azul)}
  .chip.on{background:var(--eleve-azul);border-color:var(--eleve-azul);color:#fff}
  .salvo{font-size:12px;color:var(--muted)}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px;margin-bottom:22px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;box-shadow:0 1px 2px var(--shadow)}
  .stat small{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.8px}
  .stat b{display:block;font-size:28px;font-weight:700;margin-top:8px;line-height:1.1}
  .stat span.s{display:block;font-size:12px;color:var(--muted);margin-top:4px}
  .stat.hl{border-color:var(--eleve-azul);background:var(--active-bg)}
  .stat.hl b{color:var(--eleve-azul)}

  .sicon{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;font-size:10.5px;font-weight:800;color:#fff;flex-shrink:0;line-height:1}
  .s-ok{background:#0ca30c}.s-atencao{background:#fab219;color:#0b0b0b}.s-abaixo{background:#d03b3b}.s-sem{background:#9AA4B2}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--txt);white-space:nowrap}

  .kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:16px}
  .kcard{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;cursor:pointer;display:flex;flex-direction:column;gap:9px;
         box-shadow:0 1px 2px var(--shadow);transition:border-color .15s,box-shadow .15s,transform .15s}
  .kcard:hover,.kcard:focus-visible{border-color:var(--eleve-azul);box-shadow:0 10px 26px var(--shadow);transform:translateY(-2px);outline:none}
  .ktop{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .tag svg{width:13px;height:13px}
  .chip{display:inline-flex;align-items:center;gap:6px}
  .chip svg{width:15px;height:15px}
  .agrp+.agrp{margin-top:26px}
  .ah{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--txt);margin-bottom:12px}
  .ah svg{width:20px;height:20px;color:var(--eleve-azul)}
  .ah span{font-size:11px;font-weight:600;color:var(--muted);background:var(--btn-bg);border:1px solid var(--border);border-radius:10px;padding:1px 8px;letter-spacing:0}
  .ah::after{content:"";flex:1;height:1px;background:var(--border);margin-left:6px}
  .hm-g td{text-align:left!important;background:var(--bg);padding:0!important;cursor:default}
  .hm-g span{position:sticky;left:0;display:inline-flex;align-items:center;gap:7px;padding:8px 10px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.9px;color:var(--eleve-azul)}
  .hm-g svg{width:15px;height:15px}
  .mhead small svg{width:13px;height:13px;vertical-align:-2px}
  /* gerenciar áreas */
  .alist{display:flex;flex-direction:column;gap:6px}
  .arow{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
  .arow.dragging{opacity:.35}
  .arow.dropb{box-shadow:0 -3px 0 var(--eleve-azul)}
  .arow.dropa{box-shadow:0 3px 0 var(--eleve-azul)}
  .arow.rem{background:rgba(208,59,59,.06);border-style:dashed}
  .arow.rem .ain{text-decoration:line-through}
  .aic{width:36px;height:36px;border-radius:8px;border:1px solid var(--btn-border);background:var(--active-bg);color:var(--eleve-azul);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
  .aic svg{width:20px;height:20px}
  .aic:hover,.aic.on{border-color:var(--eleve-azul)}
  .ain{flex:1;min-width:0;height:36px;border:1px solid var(--btn-border);background:var(--bg);color:var(--txt);border-radius:8px;padding:0 10px;font:inherit;font-size:14px}
  .ain:focus{outline:2px solid var(--eleve-azul);outline-offset:-1px}
  .acnt{font-size:12px;color:var(--muted);white-space:nowrap;min-width:84px;text-align:right}
  .picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;padding:10px;margin:0 0 4px 34px;border:1px solid var(--border);border-radius:10px;background:var(--bg)}
  .pk{height:40px;border-radius:8px;border:1px solid var(--btn-border);background:var(--surface);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
  .pk svg{width:20px;height:20px}
  .pk:hover{color:var(--eleve-azul);border-color:var(--eleve-azul)}
  .pk.on{background:var(--eleve-azul);border-color:var(--eleve-azul);color:#fff}
  .arem{font-size:12.5px;color:var(--muted);margin:0 0 4px 34px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--eleve-azul);background:var(--active-bg);padding:3px 8px;border-radius:5px}
  .kname{font-size:15px;font-weight:600;line-height:1.3;min-height:39px}
  .kmid{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
  .kpct{font-size:30px;font-weight:700;line-height:1;letter-spacing:-.5px}
  .kdir{font-size:11.5px;color:var(--muted);white-space:nowrap}
  .barp{height:6px;border-radius:3px;background:var(--border);overflow:hidden}
  .barp i{display:block;height:100%;border-radius:3px}
  .kval{font-size:12.5px;color:var(--muted)}
  .kval b{color:var(--txt);font-weight:600}
  .kchart{margin-top:2px;border-top:1px solid var(--border);padding-top:10px}
  .kchart svg{width:100%;height:56px;display:block}
  .vazio{background:var(--surface);border:1px dashed var(--border);border-radius:12px;padding:40px;text-align:center;color:var(--muted)}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-top:24px;overflow:hidden;box-shadow:0 1px 2px var(--shadow)}
  .panel h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);padding:14px 18px;border-bottom:1px solid var(--border)}
  .tscroll{overflow:auto}
  .tb{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
  .tb th,.tb td{padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap;text-align:right}
  .tb th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);background:var(--surface);position:sticky;top:0;z-index:2}
  .tb .l{text-align:left}
  .tb .stk{position:sticky;left:0;background:var(--surface);z-index:1}
  .tb th.stk{z-index:3}
  .tb tbody tr[data-id]{cursor:pointer}
  .tb tbody tr[data-id]:hover td{background:var(--side-hover)}
  .hm td{font-variant-numeric:tabular-nums}
  .hm-a{display:inline-block;min-width:76px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--eleve-azul)}
  .hc{display:inline-block;width:12px;font-weight:800;margin-right:4px;text-align:center}
  .h-ok{background:rgba(12,163,12,.13)}.h-atencao{background:rgba(250,178,25,.22)}.h-abaixo{background:rgba(208,59,59,.14)}
  .tb tbody tr[data-id]:hover td.h-ok{background:rgba(12,163,12,.22)}
  .tb tbody tr[data-id]:hover td.h-atencao{background:rgba(250,178,25,.32)}
  .tb tbody tr[data-id]:hover td.h-abaixo{background:rgba(208,59,59,.22)}
  .hmleg{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:12px 18px;font-size:12px;color:var(--muted);border-top:1px solid var(--border)}
  .hmleg span{display:inline-flex;align-items:center;gap:6px}

  /* Lançamentos */
  .lscroll{max-height:calc(100vh - 290px);min-height:300px}
  .lt td{padding:5px 6px}
  .lt th{padding:9px 6px}
  .lt .stk{min-width:250px;max-width:250px;white-space:normal;vertical-align:top;padding:12px 12px;border-right:1px solid var(--border)}
  .lt .stk2{position:sticky;left:250px;background:var(--surface);z-index:1;min-width:146px;border-right:1px solid var(--border)}
  .lt th.stk2{z-index:3}
  .lt tbody.grp tr:first-child td{border-top:2px solid var(--border)}
  .lt tbody.ahd td{text-align:left;background:var(--active-bg);padding:0;border-bottom:1px solid var(--border);border-top:2px solid var(--border)}
  .lt thead + tbody.ahd td{border-top:none}
  .ahl{position:sticky;left:0;display:inline-flex;align-items:center;gap:9px;padding:10px 14px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--eleve-azul)}
  .ahl svg{width:18px;height:18px}
  .ahl span{font-size:11.5px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted)}
  .lt tbody.ahd.dropa td{box-shadow:inset 0 -3px 0 var(--eleve-azul)}
  .lt tbody.grp.dropb tr:first-child td{box-shadow:inset 0 3px 0 var(--eleve-azul)}
  .lt tbody.grp.dropa tr:last-child td{box-shadow:inset 0 -3px 0 var(--eleve-azul)}
  .lt tbody.grp.dragging td{opacity:.35}
  .lt tbody.grp.moved td{animation:pisca .9s ease}
  @keyframes pisca{0%,40%{background:var(--active-bg)}}
  .li-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .grip{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:6px;cursor:grab;flex-shrink:0}
  .grip svg{width:16px;height:16px;fill:currentColor}
  .grip:hover,.grip:focus-visible{border-color:var(--btn-border);background:var(--side-hover);color:var(--eleve-azul);outline:none}
  .grip:active{cursor:grabbing}
  .grip:disabled{opacity:.3;cursor:default}
  .gripi svg{width:14px;height:14px;fill:currentColor;vertical-align:-2px}
  .lb{font-size:12px;font-weight:600;color:var(--muted)}
  .li-a{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--eleve-azul)}
  .li-a svg{width:14px;height:14px}
  .li-n{font-weight:600;font-size:14px;margin:3px 0 4px;line-height:1.3}
  .li-u{font-size:12px;color:var(--muted)}
  .li-acts{display:flex;gap:6px;margin-top:10px}
  .mini{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--btn-border);background:var(--surface);color:var(--muted);border-radius:7px;cursor:pointer}
  .mini svg{width:15px;height:15px}
  .mini:hover{border-color:var(--eleve-azul);color:var(--eleve-azul);background:var(--active-bg)}
  .mini.dng:hover{border-color:#d03b3b;color:#d03b3b;background:rgba(208,59,59,.08)}
  .num{width:104px;height:31px;border:1px solid var(--border);background:var(--bg);color:var(--txt);border-radius:6px;text-align:right;padding:0 8px;font:inherit;font-size:13px;font-variant-numeric:tabular-nums}
  .num.err{border-color:#d03b3b;background:rgba(208,59,59,.08)}
  .pc,.ac{font-size:12.5px;font-variant-numeric:tabular-nums}
  .ac{font-weight:600}

  /* Modal */
  .modal{position:fixed;inset:0;background:rgba(10,20,35,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal.show{display:flex}
  .mbox{background:var(--surface);color:var(--txt);border-radius:14px;width:min(560px,100%);max-height:94vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.3)}
  .mbox.lg{width:min(960px,100%)}
  .mhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
  .mhead h3{font-size:16px;font-weight:600}
  .mhead small{display:block;font-size:12px;color:var(--muted);margin-top:2px;font-weight:400}
  .mbody{padding:20px;overflow:auto}
  .mfoot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
  .fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
  .fld label{font-size:12.5px;font-weight:600}
  .fld label small{font-weight:400;color:var(--muted)}
  .fld input,.fld select,.fld textarea{height:38px;border:1px solid var(--btn-border);background:var(--bg);color:var(--txt);border-radius:8px;padding:0 11px;font:inherit;font-size:14px}
  .fld textarea{height:80px;padding:9px 11px;resize:vertical}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opt{border:1px solid var(--btn-border);border-radius:10px;padding:12px;cursor:pointer;display:flex;gap:11px;align-items:center;font-size:13px}
  .opt input{accent-color:var(--eleve-azul)}
  .opt b{display:block;font-size:13.5px}
  .opt small{color:var(--muted);font-size:12px}
  .opt:has(input:checked){border-color:var(--eleve-azul);background:var(--active-bg)}
  .ori{border:2px solid var(--muted);border-radius:3px;flex-shrink:0}
  .ori.p{width:17px;height:23px}.ori.l{width:23px;height:17px}
  .chk{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
  .chk input{accent-color:var(--eleve-azul);width:16px;height:16px}
  .info{font-size:12.5px;color:var(--muted);background:var(--bg);border-radius:8px;padding:10px 12px;line-height:1.5}
  .dchart svg{width:100%;height:auto;display:block}
  .leg{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:8px 0 16px}
  .leg span{display:inline-flex;align-items:center;gap:7px}
  .leg .sw{width:12px;height:12px;border-radius:3px;display:inline-block}
  .leg .ln{width:16px;height:2px;background:var(--txt);border-radius:1px;display:inline-block}
  .dmeta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px;font-size:13px;color:var(--muted)}

  #tip{position:fixed;z-index:100;pointer-events:none;background:var(--surface);color:var(--txt);border:1px solid var(--border);box-shadow:0 8px 24px var(--shadow);
       border-radius:8px;padding:8px 11px;font-size:12px;line-height:1.5;white-space:pre-line;display:none;max-width:300px}
  #tip.show{display:block}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#231F20;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;
         opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:110}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:760px){
    .vwrap{padding:18px 14px 30px}
    .lt .stk{min-width:170px;max-width:170px}
    .lt .stk2{position:static}
    .row2,.opts{grid-template-columns:1fr}
  }

  /* ===== Relatório (impressão / PDF) ===== */
  #relatorio{display:none}
  @media print{
    html,body{height:auto!important;background:#fff!important;overflow:visible!important}
    .app,.modal,#toast,#tip{display:none!important}
    #relatorio{display:block}
  }
  #relatorio{font-family:Arial,Helvetica,sans-serif;color:#231F20;font-size:10px;-webkit-print-color-adjust:exact;print-color-adjust:exact;background:#fff}
  .rp-wrap{width:100%;border-collapse:collapse}
  .rp-wrap>thead>tr>td,.rp-wrap>tbody>tr>td,.rp-wrap>tfoot>tr>td{padding:0}
  .rp-head{display:flex;align-items:center;gap:16px;padding-bottom:9px;border-bottom:3px solid #127DCB;margin-bottom:12px}
  .rp-logo{width:150px;height:auto;color:#231F20;display:block;flex-shrink:0}
  .rp-ht{flex:1;border-left:1px solid #DCE3EC;padding-left:16px}
  .rp-t{font-size:14px;font-weight:700;letter-spacing:.4px;color:#0B4E83}
  .rp-s{font-size:10px;color:#5F6B7A;margin-top:3px}
  .rp-meta{text-align:right;font-size:9px;color:#5F6B7A;line-height:1.5}
  .rp-meta b{color:#231F20}
  .rp-sum{display:flex;gap:8px;margin:0 0 12px}
  .rp-box{flex:1;border:1px solid #DCE3EC;border-radius:6px;padding:7px 9px}
  .rp-box small{display:flex;gap:5px;align-items:center;color:#5F6B7A;font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .rp-box b{display:block;font-size:17px;margin-top:3px}
  .rp-box.hl{background:#EAF3FC;border-color:#127DCB}.rp-box.hl b{color:#0B4E83}
  #relatorio .sicon{width:13px;height:13px;font-size:8px}
  #relatorio .pill{font-size:9px;color:#231F20;gap:4px}
  .rp-tb{width:100%;border-collapse:collapse}
  .rp-tb th{background:#0B4E83;color:#fff;font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:5px 6px;text-align:right}
  .rp-tb td{border-bottom:1px solid #E3E8EF;padding:4px 6px;text-align:right;white-space:nowrap}
  .rp-tb .l{text-align:left}
  .rp-tb tr,.rp-tb tbody{break-inside:avoid;page-break-inside:avoid}
  .rp-grp td svg{width:11px;height:11px;vertical-align:-2px;margin-right:5px}
  .rp-gh{break-after:avoid;page-break-after:avoid}
  .rp-grp td{background:#EAF3FC;color:#0B4E83;font-weight:700;text-transform:uppercase;font-size:8.5px;letter-spacing:.6px}
  .rp-bar{display:inline-block;width:42px;height:5px;background:#E3E8EF;border-radius:3px;vertical-align:middle;margin-right:5px;overflow:hidden}
  .rp-bar i{display:block;height:100%;border-radius:3px}
  .rp-ano td,.rp-ano th{padding:3px 4px}
  .rp-ano td.rp-n{white-space:normal;vertical-align:top;font-weight:700;width:120px}
  .rp-ano td.rp-n small{display:block;font-weight:700;color:#127DCB;font-size:7px;text-transform:uppercase;letter-spacing:.5px}
  .rp-ano tbody tr:first-child td{border-top:1.5px solid #0B4E83}
  .rp-ano .rp-lb{color:#5F6B7A;font-weight:700}
  #relatorio.portrait .rp-ano{font-size:7px}
  #relatorio.portrait .rp-ano th{font-size:6.5px}
  #relatorio.landscape .rp-ano{font-size:8.5px}
  .rp-legend{margin-top:10px;font-size:8.5px;color:#5F6B7A;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
  .rp-legend span{display:inline-flex;gap:4px;align-items:center}
  .rp-obs{margin-top:12px;border:1px solid #DCE3EC;border-radius:6px;padding:8px 10px;white-space:pre-wrap;break-inside:avoid}
  .rp-obs b{display:block;font-size:8.5px;text-transform:uppercase;color:#0B4E83;margin-bottom:4px}
  .rp-foot{border-top:1px solid #DCE3EC;margin-top:10px;padding-top:5px;font-size:8px;color:#5F6B7A;display:flex;justify-content:space-between}
  /* unidade nas linhas de lançamento */
  .lbw{display:flex;align-items:center;justify-content:space-between;gap:6px}
  .usel{height:26px;max-width:62px;border:1px solid var(--eleve-azul);background:var(--active-bg);color:var(--eleve-azul);border-radius:6px;padding:0 4px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
  .usel:hover{background:var(--eleve-azul);color:#fff}
  .usel:focus{outline:2px solid var(--eleve-azul);outline-offset:1px}
  .usel option{background:var(--surface);color:var(--txt);font-weight:500}
  .ub{font-size:12px;font-weight:700;color:var(--muted);padding:0 6px}
  .nw{position:relative;display:inline-block}
  .nw::before{content:attr(data-u);position:absolute;top:50%;transform:translateY(-50%);font-size:11px;font-weight:600;color:var(--muted);pointer-events:none;opacity:.85}
  .nw.pre::before{left:8px}
  .nw.suf::before{right:8px}
  .lt .num{width:122px}
  .rp-u{font-weight:400;color:#127DCB}
  #relatorio .rp-ano td{font-variant-numeric:tabular-nums}
  #relatorio.portrait .rp-ano td,#relatorio.portrait .rp-ano th{padding:3px 2px}
  #relatorio.portrait .rp-ano td.rp-n{width:92px}
  #relatorio.portrait .rp-ano{font-size:6.6px}

  /* ===== Tela inicial (nova) ===== */
  .hx{position:relative;overflow:hidden;background:var(--surface);border-bottom:1px solid var(--border)}
  .hx::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(900px 360px at 88% -20%,rgba(18,125,203,.18),transparent 60%),radial-gradient(640px 300px at -8% 130%,rgba(11,78,131,.12),transparent 60%)}
  .hx::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.45;
    background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);background-size:34px 34px;
    -webkit-mask-image:linear-gradient(100deg,transparent 35%,#000 95%);mask-image:linear-gradient(100deg,transparent 35%,#000 95%)}
  .hx-deco{position:absolute;right:-70px;top:-60px;width:400px;opacity:.07;pointer-events:none;transform:rotate(-8deg)}
  .hx-deco svg{width:100%;height:auto;display:block}
  .hx-in{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:34px 32px 32px;display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:36px;align-items:center}
  .hx .hero-logo{max-width:220px;width:100%;height:auto;color:var(--logo-txt);display:block}
  .hx-tag{font-size:11px;text-transform:uppercase;letter-spacing:1.8px;color:var(--muted);margin:8px 0 22px}
  .hx-greet{font-size:30px;font-weight:700;letter-spacing:-.5px;line-height:1.2}
  .hx-greet span{background:linear-gradient(90deg,#127DCB,#3B9BE0);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hx-date{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-top:8px}
  .hx-clock{font-variant-numeric:tabular-nums;font-weight:600;color:var(--txt);padding:2px 9px;border:1px solid var(--border);border-radius:6px;background:var(--bg)}
  .hx-search{margin-top:22px;display:flex;align-items:center;gap:10px;max-width:540px;height:48px;padding:0 9px 0 15px;border:1px solid var(--btn-border);border-radius:12px;
    background:var(--bg);box-shadow:0 1px 2px var(--shadow);cursor:text;transition:border-color .15s,box-shadow .15s}
  .hx-search:focus-within{border-color:var(--eleve-azul);box-shadow:0 0 0 4px var(--active-bg)}
  .hx-search>svg{width:18px;height:18px;color:var(--muted);flex-shrink:0}
  .hx-search input{flex:1;min-width:0;height:100%;border:none;background:transparent;color:var(--txt);font:inherit;font-size:14px;outline:none}
  .home kbd{font-family:inherit;font-size:11px;font-weight:600;line-height:1;color:var(--muted);border:1px solid var(--btn-border);border-bottom-width:2px;border-radius:5px;padding:3px 6px;background:var(--surface)}
  /* widget de desempenho */
  .hk{width:100%;text-align:left;font:inherit;color:var(--txt);background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px;cursor:pointer;
    box-shadow:0 12px 32px var(--shadow);display:flex;flex-direction:column;gap:14px;transition:border-color .15s,transform .15s,box-shadow .15s}
  .hk:hover,.hk:focus-visible{border-color:var(--eleve-azul);transform:translateY(-2px);outline:none}
  .hk-h{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
  .hk-h svg{width:15px;height:15px;color:var(--eleve-azul)}
  .hk-b{display:flex;align-items:center;gap:20px}
  .hk-ring{position:relative;width:116px;height:116px;flex-shrink:0}
  .hk-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .hk-ring circle{transition:stroke-dasharray .6s ease}
  .hk-ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .hk-ring b{font-size:25px;font-weight:700;line-height:1;letter-spacing:-.5px}
  .hk-ring small{font-size:9.5px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.6px;text-align:center;line-height:1.25}
  .hk-l{flex:1;display:flex;flex-direction:column;gap:8px;font-size:13px}
  .hk-l div{display:flex;align-items:center;gap:8px}
  .hk-l b{margin-left:auto;font-variant-numeric:tabular-nums}
  .hk-f{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--border);padding-top:12px}
  .hk-f span{display:inline-flex;align-items:center;gap:5px;color:var(--eleve-azul);font-weight:600}
  .hk-f svg{width:14px;height:14px;transition:transform .15s}
  .hk:hover .hk-f svg{transform:translateX(3px)}
  /* seções e cards */
  .home .wrap{padding-top:26px}
  .home .wrap h2.hsec{display:flex;align-items:center;gap:10px}
  .home .wrap h2.hsec::after{content:"";flex:1;height:1px;background:var(--border)}
  .hrec{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:26px}
  .hrec:empty{display:none}
  .hrec>span{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);margin-right:4px}
  .hrec>span svg{width:14px;height:14px}
  .rchip{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 13px 0 10px;border:1px solid var(--border);background:var(--surface);color:var(--txt);
    border-radius:16px;font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:border-color .15s,background .15s}
  .rchip svg{width:16px;height:16px;color:var(--eleve-azul)}
  .rchip:hover{border-color:var(--eleve-azul);background:var(--active-bg)}
  .gfeat{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));margin-bottom:34px}
  .home .card{position:relative}
  .home .card:focus-visible{outline:2px solid var(--eleve-azul);outline-offset:2px}
  .card.feat{overflow:hidden;color:#fff;border:none;background:linear-gradient(135deg,#127DCB 0%,#0B4E83 100%);box-shadow:0 8px 24px rgba(11,78,131,.25)}

    box-shadow:-70px -50px 0 -30px rgba(255,255,255,.05);pointer-events:none;transition:transform .4s}

  .card.feat b{color:#fff;font-size:17px}
  .card.feat small{color:rgba(255,255,255,.82)}
  .card.feat .cic{background:rgba(255,255,255,.16);color:#fff}
  .card.feat .go{color:#fff;border-top-color:rgba(255,255,255,.22)}
  .fstat{position:relative;z-index:1;display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
  .fstat:empty{display:none}
  .fstat span{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:rgba(255,255,255,.15);border-radius:20px;padding:4px 10px}
  .fstat .sicon{width:15px;height:15px;font-size:9px}
  .ck{position:absolute;top:16px;right:16px}
  .card.feat .ck{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
  .cst{position:absolute;top:18px;right:46px;display:none;align-items:center;gap:5px;font-size:11px;font-weight:600;color:#0ca30c}
  .cst i{width:6px;height:6px;border-radius:50%;background:#22c55e}
  .card.on .cst{display:inline-flex}
  .home .card .cic{transition:transform .2s,background .2s,color .2s}

  /* cards de sistema com capa ilustrada */
  #grid{grid-template-columns:repeat(auto-fill,minmax(205px,1fr))}
  .card.sis{padding:0;overflow:hidden}
  .card.sis:hover{border-color:var(--c1)}
  .ccapa{position:relative;height:122px;overflow:hidden;background:linear-gradient(135deg,var(--c1),var(--c2))}
  .ccapa::before{content:"";position:absolute;inset:0;pointer-events:none;

function abrir(id){
  if(PROTEGIDAS.includes(id) && !liberado()){
    if(!atual) abrir('home');
    pedirSenha(() => abrir(id));
    return;
  }
  atual = id;
  document.querySelectorAll('.item').forEach(i => i.classList.toggle('active', i.dataset.id === id));
  Object.values(iframes).forEach(f => f.classList.remove('show'));
  Object.values(VIEWS).forEach(v => v.classList.remove('show'));
  home.classList.remove('show');
  side.classList.remove('open');
  const interno = INTERNOS.find(x => x.id === id);

  if(id === 'home'){
    home.classList.add('show'); titulo.textContent = 'Início'; renderHome();
  } else if(interno){
    interno.render();
    VIEWS[id].classList.add('show'); VIEWS[id].scrollTop = 0;
    titulo.textContent = interno.nome;
  } else {
    const s = SISTEMAS.find(x => x.id === id);
    if(!iframes[id]){
      const f = document.createElement('iframe');
      f.src = s.url; f.title = s.nome;
      f.setAttribute('allow','clipboard-read; clipboard-write; fullscreen');
      frames.appendChild(f);
      iframes[id] = f;
      document.querySelector(`.item[data-id="${id}"]`).classList.add('loaded');
    }
    iframes[id].classList.add('show');
    titulo.textContent = s.nome;
  }
  history.replaceState(null, '', '#' + id);
  if(id !== 'home') registrarRecente(id);
}

function sha256(str){
  const b = [...new TextEncoder().encode(str)], l = b.length * 8;
  const P = [], K = [], H = [];
  for(let n = 2; P.length < 64; n++) if(P.every(p => n % p)) P.push(n);
  P.forEach((p, i) => { K[i] = (Math.pow(p, 1/3) % 1) * 4294967296 | 0; if(i < 8) H[i] = (Math.pow(p, 1/2) % 1) * 4294967296 | 0; });

  for(let i = 7; i >= 0; i--) b.push(i > 3 ? 0 : (l >>> (i * 8)) & 255);
  const rr = (x, n) => (x >>> n) | (x << (32 - n));
  for(let o = 0; o < b.length; o += 64){
    const w = [];
    for(let i = 0; i < 64; i++){
      if(i < 16) w[i] = (b[o + i * 4] << 24) | (b[o + i * 4 + 1] << 16) | (b[o + i * 4 + 2] << 8) | b[o + i * 4 + 3];
      else { const a = w[i - 15], c = w[i - 2];
        w[i] = (w[i - 16] + (rr(a, 7) ^ rr(a, 18) ^ (a >>> 3)) + w[i - 7] + (rr(c, 17) ^ rr(c, 19) ^ (c >>> 10))) | 0; }
    }
    let [A, B, C, D, E, F, G, Hh] = H;
    for(let i = 0; i < 64; i++){
      const t1 = (Hh + (rr(E, 6) ^ rr(E, 11) ^ rr(E, 25)) + ((E & F) ^ (~E & G)) + K[i] + w[i]) | 0;
      const t2 = ((rr(A, 2) ^ rr(A, 13) ^ rr(A, 22)) + ((A & B) ^ (A & C) ^ (B & C))) | 0;
      Hh = G; G = F; F = E; E = (D + t1) | 0; D = C; C = B; B = A; A = (t1 + t2) | 0;
    }
    [A, B, C, D, E, F, G, Hh].forEach((x, i) => H[i] = (H[i] + x) | 0);
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');

function normalizarDB(d){
  if(!Array.isArray(d.areas)) d.areas = AREAS_PADRAO.map(nome => ({ nome, icone:iconePorNome(nome) }));
  d.areas = d.areas.filter(a => a && a.nome).map(a => ({ nome:String(a.nome), icone:ICON_PATHS[a.icone] ? a.icone : iconePorNome(a.nome) }));

  d.global = { nome:String(g.nome || 'Eficiência Global da Empresa').slice(0, 80), teto:TETOS.some(x => x.v === t) ? t : 1 };

}

/* ---- Sincronização com o servidor ----
   Cada alteração é enviada como "diferença" (só as células mudadas + a estrutura, se mudou),
   assim duas pessoas lançando ao mesmo tempo não apagam o trabalho uma da outra. */
const CHAVE_BASE = 'portalEleveBase';
const clone = o => JSON.parse(JSON.stringify(o));
const estruturaDe = d => ({ indicadores:d.indicadores, areas:d.areas, global:d.global });
function calcDiff(base, atual){
  const valores = [], BV = base.valores || {};
  Object.keys(atual.valores).forEach(ano => {
    const A = atual.valores[ano], B = BV[ano] || {};
    Object.keys(A).forEach(id => ['meta', 'real'].forEach(c => {
      for(let m = 0; m < 12; m++){
        const v = ((A[id] || {})[c] || [])[m] ?? null, b = ((B[id] || {})[c] || [])[m] ?? null;
        if(v !== b) valores.push([ano, id, c, m, v]);
      }
    }));
  });
  const ea = JSON.stringify(estruturaDe(atual)), eb = JSON.stringify(estruturaDe(base));
  const idsB = new Set(base.indicadores.map(i => i.id)), idsA = new Set(atual.indicadores.map(i => i.id));
  return { valores, anos:Object.keys(atual.valores).filter(a => !BV[a]),
    estrutura:ea !== eb ? JSON.parse(ea) : null,
    adicionados:[...idsA].filter(x => !idsB.has(x)), removidos:[...idsB].filter(x => !idsA.has(x)) };
}
const diffVazio = d => !d.valores.length && !d.estrutura && !d.anos.length;
// (mesma função existe no servidor — Code.gs)
function aplicarDiff(db, diff, papel){
  if(diff.estrutura){
    const e = diff.estrutura, add = new Set(diff.adicionados || []), rem = new Set(diff.removidos || []);
    if(!Array.isArray(e.indicadores) || !Array.isArray(e.areas)) throw new Error('Estrutura inválida');
    if(papel !== 'admin' && (add.size || rem.size)) throw new Error('Somente o administrador pode incluir ou excluir indicadores');
    const srv = {}; db.indicadores.forEach(i => srv[i.id] = 1);
    const lista = e.indicadores.filter(i => i && (srv[i.id] || add.has(i.id)));
    const cli = {}; lista.forEach(i => cli[i.id] = 1);
    db.indicadores.forEach(i => { if(!cli[i.id] && !rem.has(i.id)) lista.push(i); });   // criados por outra pessoa enquanto isso
    db.indicadores = lista; db.areas = e.areas; if(e.global) db.global = e.global;
    db.indicadores.forEach(i => { if(!db.areas.some(a => a.nome === i.area)) db.areas.push({ nome:i.area, icone:'tag' }); });
    const ok = { __global:1 }; db.indicadores.forEach(i => ok[i.id] = 1);
    Object.keys(db.valores).forEach(a => Object.keys(db.valores[a]).forEach(id => { if(!ok[id]) delete db.valores[a][id]; }));
  }
  (diff.anos || []).forEach(a => { if(/^\d{4}$/.test(a) && !db.valores[a]) db.valores[a] = {}; });
  const ok = { __global:1 }; db.indicadores.forEach(i => ok[i.id] = 1);
  (diff.valores || []).forEach(([a, id, c, m, v]) => {
    if(!ok[id] || (c !== 'meta' && c !== 'real') || !(m >= 0 && m < 12) || !/^\d{4}$/.test(a)) return;
    if(v !== null && (typeof v !== 'number' || !isFinite(v))) return;
    const A = db.valores[a] || (db.valores[a] = {});
    const x = A[id] || (A[id] = { meta:Array(12).fill(null), real:Array(12).fill(null) });
    x[c][m] = v;
  });
  return db;
}
async function chamar(dados){

function receberServidor(dbS, rev){

function agendarEnvio(){

async function enviar(){
  if(SYNC.enviando){ SYNC.denovo = true; return; }
  if(!SYNC.base){ SYNC.timer = setTimeout(enviar, 3000); return; }
  const diff = calcDiff(SYNC.base, DB);
  if(diffVazio(diff)){ setEstado('ok'); return; }
  const tok = tokenAtual();
  if(!tok){ toast('Entre com a senha para salvar no servidor'); DB = normalizarDB(clone(SYNC.base)); guardarLocal(); redesenhar(); return; }
  SYNC.enviando = true; SYNC.seq++; setEstado('env');
  const enviado = clone(DB);
  try {
    const j = await chamar({ acao:'salvar', token:tok, diff });
    const depois = calcDiff(enviado, DB);                 // digitado enquanto enviava
    SYNC.base = normalizarDB(clone(j.db)); SYNC.rev = j.rev;
    const novo = clone(SYNC.base); if(!diffVazio(depois)) aplicarDiff(novo, depois, papel());
    const antes = JSON.stringify(DB); DB = normalizarDB(novo); guardarLocal();
    setEstado('ok'); marcarSalvo(true);
    if(JSON.stringify(DB) !== antes) redesenhar();
    if(!diffVazio(depois)) agendarEnvio();
  } catch(e){
    if(e.servidor){ toast(e.message); DB = normalizarDB(clone(SYNC.base)); guardarLocal(); redesenhar(); setEstado('ok'); }
    else { setEstado('off'); SYNC.timer = setTimeout(enviar, 15000); }
  } finally {

  }
}
async function verificar(inicial){

    if(seq !== SYNC.seq) return;                            // chegou uma resposta mais nova
    if(j.vazio){ SYNC.vazio = true; SYNC.carregado = true; setEstado('vazio'); redesenhar(); return; }
    if(j.db) receberServidor(j.db, j.rev);
    else if(SYNC.estado === 'off' || SYNC.estado === 'carr') setEstado(diffVazio(calcDiff(SYNC.base, DB)) ? 'ok' : 'pend');
    if(!j.db && SYNC.base && !SYNC.enviando && !diffVazio(calcDiff(SYNC.base, DB))) agendarEnvio();

function atingimento(ind, meta, real){

  if(ind.direcao === 'menor'){ if(real <= 0) return meta >= 0 ? 1 : null; if(meta <= 0) return 0; return meta / real; }
  if(meta === 0) return null;

}

function periodo(ind, ano, mes){
  const v = vals(ano, ind.id);
  if(mes !== 'acum'){ const meta = v.meta[mes], real = v.real[mes]; return { meta, real, a:atingimento(ind, meta, real) }; }
  const idx = [...Array(12).keys()].filter(i => v.meta[i] != null && v.real[i] != null);
  if(!idx.length) return { meta:null, real:null, a:null, n:0 };
  const soma = k => idx.reduce((t, i) => t + v[k][i], 0);
  let meta = soma('meta'), real = soma('real');
  if(ind.agregacao === 'media'){ meta /= idx.length; real /= idx.length; }
  return { meta, real, a:atingimento(ind, meta, real), n:idx.length };
}

function eficiencia(lista, ano, mes){
  const as = lista.map(i => capA(periodo(i, ano, mes).a)).filter(a => a != null);
  return as.length ? { v:as.reduce((t, a) => t + a, 0) / as.length * 100, n:as.length } : { v:null, n:0 };
}

function garantirAno(){
  const a = anos();
  if(!EST.ano || !a.includes(EST.ano)){
    const cur = String(new Date().getFullYear());
    EST.ano = a.includes(cur) ? cur : a[a.length - 1]; EST.mes = null;
  }
  if(EST.mes == null) EST.mes = ultimoMes(EST.ano);
}

// ---- Gráfico de barras (realizado, cor = status) com marcação da meta
function escala(min, max){
  const raw = (max - min) / 4 || 1, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  const a = Math.floor(min / step) * step, b = Math.ceil(max / step) * step, ticks = [];
  for(let t = a; t <= b + step / 2; t += step) ticks.push(Math.round(t * 1e6) / 1e6);
  return { min:a, max:b, ticks };
}
function barra(x, w, yb, yt, r){
  if(Math.abs(yb - yt) < .5) return '';
  r = Math.min(r, w / 2, Math.abs(yb - yt));
  return yt < yb
    ? `M${x} ${yb}V${yt + r}Q${x} ${yt} ${x + r} ${yt}H${x + w - r}Q${x + w} ${yt} ${x + w} ${yt + r}V${yb}Z`
    : `M${x} ${yb}V${yt - r}Q${x} ${yt} ${x + r} ${yt}H${x + w - r}Q${x + w} ${yt} ${x + w} ${yt - r}V${yb}Z`;
}
function grafico(ind, ano, o){
  const v = o.v || vals(ano, ind.id), W = o.w, H = o.h, mini = !!o.mini, lr = o.lblReal || 'Realizado';
  const P = mini ? {l:2, r:2, t:4, b:4} : {l:70, r:12, t:14, b:30};
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const todos = [...v.meta, ...v.real].filter(x => x != null);
  let max = Math.max(0, ...todos), min = Math.min(0, ...todos), ticks = [];
  if(max === min) max = min + 1;
  if(!mini) ({min, max, ticks} = escala(min, max));
  const y = val => P.t + (max - val) / (max - min) * ih, y0 = y(0);
  const slot = iw / 12, bw = Math.min(slot * .56, 36), u = ind.unidade;
  let s = `<svg viewBox="0 0 ${W} ${H}" ${mini ? 'preserveAspectRatio="none"' : ''} role="img" aria-label="Gráfico mensal de ${esc(ind.nome)}">`;
  ticks.forEach(t => {
    s += `<line x1="${P.l}" x2="${W - P.r}" y1="${y(t)}" y2="${y(t)}" style="stroke:var(--border)" stroke-width="1"/>`;
    s += `<text x="${P.l - 8}" y="${y(t) + 4}" text-anchor="end" style="fill:var(--muted);font-size:11px">${esc(fmtCurto(t, u))}</text>`;
  });
  for(let k = 0; k < 12; k++){
    const cx = P.l + slot * k + slot / 2, m = v.meta[k], r = v.real[k];
    if(o.sel === k) s += `<rect x="${P.l + slot * k + 1}" y="${P.t - (mini ? 4 : 6)}" width="${slot - 2}" height="${ih + (mini ? 8 : 12)}" rx="4" style="fill:var(--active-bg)"/>`;
    const a = atingimento(ind, m, r), st = status(a);
    if(r != null) s += `<path d="${barra(cx - bw / 2, bw, y0, y(r), mini ? 2 : 4)}" fill="${st === 'sem' ? '#127DCB' : ST[st].c}"/>`;
    if(m != null) s += `<line x1="${cx - slot * .38}" x2="${cx + slot * .38}" y1="${y(m)}" y2="${y(m)}" style="stroke:var(--txt)" stroke-width="2" stroke-linecap="round"/>`;
    if(!mini) s += `<text x="${cx}" y="${H - 9}" text-anchor="middle" style="fill:${o.sel === k ? 'var(--eleve-azul)' : 'var(--muted)'};font-size:11px;font-weight:${o.sel === k ? 700 : 400}">${MESES[k]}</text>`;
    const tip = `${MESES_LONGO[k]}/${ano}\nMeta: ${fmt(m, u)}\n${lr}: ${fmt(r, u)}\nAtingimento: ${pct(a)} · ${ST[st].n}`;
    s += `<rect x="${P.l + slot * k}" y="0" width="${slot}" height="${H}" fill="transparent" data-tip="${esc(tip)}"/>`;
  }
  s += `<line x1="${P.l}" x2="${W - P.r}" y1="${y0}" y2="${y0}" style="stroke:var(--muted)" stroke-opacity=".5" stroke-width="1"/>`;
  return s + '</svg>';
}

function tabelaAnual(lista){
  if(!lista.length) return '';
  const cel = (i, p, mes) => {
    const s = status(p.a);
    const tip = `${i.nome} · ${nomeMes(mes, EST.ano)}\nMeta: ${fmt(p.meta, i.unidade)}\nRealizado: ${fmt(p.real, i.unidade)}\n${ST[s].n}`;
    return `<td class="${p.a == null ? '' : 'h-' + s}" data-tip="${esc(tip)}">${p.a == null ? '<span style="color:var(--muted)">·</span>' : `<span class="hc">${ST[s].i}</span>${pct(p.a)}`}</td>`;
  };
  const celG = mes => {
    const p = periodoGlobal(EST.ano, mes), s = status(p.a);
    const tip = `${DB.global.nome} · ${nomeMes(mes, EST.ano)}\nEficiência: ${fmtG(p.real)} (${p.n} indicadores)\nMeta: ${fmtG(p.meta)}\nAtingimento: ${pct(p.a)} · ${ST[s].n}`;
    return `<td class="${p.a == null ? '' : 'h-' + s}" data-tip="${esc(tip)}">${p.real == null ? '<span style="color:var(--muted)">·</span>' : (p.a == null ? '' : `<span class="hc">${ST[s].i}</span>`) + fmtG(p.real)}</td>`;
  };
  return `<table class="tb hm"><thead><tr><th class="l stk">Indicador</th>${MESES.map(m => `<th>${m}</th>`).join('')}<th>Acum.</th></tr></thead><tbody>

    ${grupos(lista).map(g => `<tr class="hm-g"><td colspan="14"><span>${ic(areaIcone(g.area))}${esc(g.area)}</span></td></tr>` +
      g.itens.map(i => `<tr data-id="${esc(i.id)}"><td class="l stk">${esc(i.nome)}</td>
      ${MESES.map((_, k) => cel(i, periodo(i, EST.ano, k), k)).join('')}${cel(i, periodo(i, EST.ano, 'acum'), 'acum')}</tr>`).join('')).join('')}
  </tbody></table>`;
}

function abrirDetalhe(id){
  if(id === GID) return abrirDetalheGlobal();
  const i = DB.indicadores.find(x => x.id === id); if(!i) return;
  const v = vals(EST.ano, id), u = i.unidade, ac = periodo(i, EST.ano, 'acum');
  const linhas = MESES.map((_, k) => {
    const a = atingimento(i, v.meta[k], v.real[k]);
    return `<tr><td class="l">${MESES_LONGO[k]}</td><td>${fmt(v.meta[k], u)}</td><td>${fmt(v.real[k], u)}</td><td>${pct(a)}</td><td class="l">${sPill(status(a))}</td></tr>`;
  }).join('');
  abrirModal({
    largo:true,
    titulo:`${esc(i.nome)}<small>${ic(areaIcone(i.area))} ${esc(i.area)} · ${esc(u)} · ${dirTxt(i)} · ${EST.ano}</small>`,
    corpo:`<div class="dchart">${grafico(i, EST.ano, { w:900, h:290, sel:EST.mes === 'acum' ? -1 : EST.mes })}</div>
      <div class="leg"><span><i class="sw" style="background:#0ca30c"></i><i class="sw" style="background:#fab219"></i><i class="sw" style="background:#d03b3b"></i>Realizado (cor = status)</span><span><i class="ln"></i>Meta</span></div>
      <div class="tscroll"><table class="tb"><thead><tr><th class="l">Mês</th><th>Meta</th><th>Realizado</th><th>% Ating.</th><th class="l">Status</th></tr></thead>
      <tbody>${linhas}</tbody>
      <tfoot><tr><td class="l"><b>Acumulado</b>${ac.n ? ` <small style="color:var(--muted)">(${ac.n} ${ac.n === 1 ? 'mês' : 'meses'}, ${i.agregacao === 'media' ? 'média' : 'soma'})</small>` : ''}</td>
        <td><b>${fmt(ac.meta, u)}</b></td><td><b>${fmt(ac.real, u)}</b></td><td><b>${pct(ac.a)}</b></td><td class="l">${sPill(status(ac.a))}</td></tr></tfoot></table></div>`,
    rodape:`<button class="btn" data-close>Fechar</button><button class="btn pri" data-m="editar">${ic('edit')}<span class="t">Editar valores</span></button>`,
    acoes:{ editar:() => { fecharModal(); EST.lancArea = i.area; abrir('lancamentos');
      setTimeout(() => { const el = vLanc.querySelector(`.num[data-id="${CSS.escape(id)}"]`); if(el){ el.scrollIntoView({block:'center'}); el.focus(); } }, 30); } }
  });
}

vInd.addEventListener('change', e => {
  if(e.target.id === 'fAno'){ EST.ano = e.target.value; EST.mes = null; renderPainel(); }
  if(e.target.id === 'fMes'){ EST.mes = e.target.value === 'acum' ? 'acum' : +e.target.value; renderPainel(); }
});
vInd.addEventListener('click', e => {
  const chip = e.target.closest('.chip'); if(chip){ EST.area = chip.dataset.area; renderPainel(); return; }
  const act = e.target.closest('[data-act]');
  if(act){ if(act.dataset.act === 'pdf') modalRelatorio(); if(act.dataset.act === 'ir-lanc'){ EST.lancArea = EST.area; abrir('lancamentos'); } return; }
  const card = e.target.closest('[data-id]'); if(card) abrirDetalhe(card.dataset.id);
});
vInd.addEventListener('keydown', e => { if(e.key === 'Enter' && (e.target.classList.contains('kcard') || e.target.classList.contains('gcard'))) abrirDetalhe(e.target.dataset.id); });

vLanc.addEventListener('change', e => {
  const t = e.target;
  if(t.id === 'lAno'){ EST.ano = t.value; EST.mes = null; renderLanc(); return; }
  if(t.id === 'lArea'){ EST.lancArea = t.value; renderLanc(); return; }
  if(t.classList.contains('usel')){
    const i = DB.indicadores.find(x => x.id === t.dataset.un); if(!i) return;
    let u = t.value;
    if(u === '__outra'){ u = pedirUnidade(); if(!u){ t.value = i.unidade; return; } }
    i.unidade = u; salvarDB(); renderLanc(); toast(`Unidade de "${i.nome}" alterada para ${u}`);
    return;
  }
  if(t.classList.contains('num')){
    const i = t.dataset.id === GID ? indGlobal() : DB.indicadores.find(x => x.id === t.dataset.id); if(!i) return;
    const n = parseNum(t.value);
    if(Number.isNaN(n)){ t.classList.add('err'); toast('Valor inválido — use apenas números'); return; }
    t.classList.remove('err');
    vals(EST.ano, i.id)[t.dataset.c][+t.dataset.m] = n;
    t.value = num(n, 4);
    salvarDB(); if(i.id !== GID) atualizarLinha(i, +t.dataset.m); atualizarGlobal();
  }
});

    case 'cfg-global': modalGlobal(); break;

});

// ---- Reordenar indicadores (arrastar e soltar ou setas no teclado)
function moverIndicador(id, alvoId, depois, areaAlvo){
  const ind = DB.indicadores.find(x => x.id === id); if(!ind) return;
  const alvo = alvoId ? DB.indicadores.find(x => x.id === alvoId) : null;
  const novaArea = alvo ? alvo.area : areaAlvo;
  if(!novaArea || (alvo === ind)) return;
  if(novaArea !== ind.area && !confirm(`Mover "${ind.nome}" da área ${ind.area} para ${novaArea}?`)) return;
  const mudouArea = novaArea !== ind.area;
  ind.area = novaArea;
  const arr = DB.indicadores.filter(x => x !== ind);
  let pos;
  if(alvo) pos = arr.indexOf(alvo) + (depois ? 1 : 0);
  else { const p = arr.findIndex(x => x.area === novaArea); pos = p < 0 ? arr.length : p; }
  arr.splice(pos, 0, ind);
  DB.indicadores = arr; salvarDB(); renderLanc(); marcarSalvo();
  const tb = vLanc.querySelector(`tbody.grp[data-id="${CSS.escape(id)}"]`);
  if(tb){ tb.classList.add('moved'); setTimeout(() => tb.classList.remove('moved'), 900); }
  if(mudouArea) toast(`Movido para ${novaArea}`);
  return tb;
}
let arrastando = null;
const limparDrop = () => vLanc.querySelectorAll('.dropb,.dropa').forEach(t => t.classList.remove('dropb', 'dropa'));
function fimArraste(){ arrastando = null; limparDrop(); vLanc.querySelectorAll('tbody.grp.dragging').forEach(t => t.classList.remove('dragging')); }
vLanc.addEventListener('dragstart', e => {
  const g = e.target.closest && e.target.closest('.grip'); if(!g) return;
  const tb = g.closest('tbody.grp');
  arrastando = tb.dataset.id;
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', arrastando);
  try { e.dataTransfer.setDragImage(tb.querySelector('td.stk'), 24, 20); } catch(_){}
  setTimeout(() => tb.classList.add('dragging'), 0);
});
vLanc.addEventListener('dragover', e => {
  if(!arrastando) return;
  const alvo = e.target.closest('tbody.grp, tbody.ahd'); limparDrop(); if(!alvo || alvo.classList.contains('gl')) return;
  e.preventDefault(); e.dataTransfer.dropEffect = 'move';
  if(alvo.classList.contains('ahd')){ alvo.classList.add('dropa'); return; }
  if(alvo.dataset.id === arrastando) return;
  const r = alvo.getBoundingClientRect();
  alvo.classList.add(e.clientY < r.top + r.height / 2 ? 'dropb' : 'dropa');
});
vLanc.addEventListener('drop', e => {
  if(!arrastando) return; e.preventDefault();
  const alvo = vLanc.querySelector('.dropb,.dropa'), id = arrastando, depois = !!alvo && alvo.classList.contains('dropa');
  fimArraste(); if(!alvo) return;
  if(alvo.classList.contains('ahd')) moverIndicador(id, null, false, alvo.dataset.area);
  else moverIndicador(id, alvo.dataset.id, depois);
});
vLanc.addEventListener('dragend', fimArraste);
vLanc.addEventListener('keydown', e => {
  const g = e.target.closest && e.target.closest('.grip');
  if(!g || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
  e.preventDefault();
  const lista = filtrados(EST.lancArea), k = lista.findIndex(x => x.id === g.dataset.grip);
  const viz = lista[k + (e.key === 'ArrowDown' ? 1 : -1)]; if(!viz) return;
  const tb = moverIndicador(g.dataset.grip, viz.id, e.key === 'ArrowDown');
  tb?.querySelector('.grip')?.focus();
});

function modalAreas(){

  let L = DB.areas.map(a => ({ nome:a.nome, icone:a.icone, orig:a.nome, rem:false, dest:null, pick:false, auto:false }));
  let arr = null;
  const ativos = () => L.filter(a => !a.rem);
  function desenhar(){
    const box = document.getElementById('aList'); if(!box) return;
    box.innerHTML = L.map((a, k) => {
      const n = cont(a.orig), outros = L.map((b, j) => ({ b, j })).filter(o => !o.b.rem && o.j !== k);
      return `<div class="arow ${a.rem ? 'rem' : ''}" data-k="${k}">
        <button class="grip" data-ag="${k}" title="Arraste para mudar a ordem (ou use as setas ↑ ↓)" ${a.rem ? 'disabled' : ''}>${ic('grip')}</button>
        <button class="aic ${a.pick ? 'on' : ''}" data-pick="${k}" title="Escolher ícone" ${a.rem ? 'disabled' : ''}>${ic(a.icone)}</button>
        <input class="ain" data-nome="${k}" value="${esc(a.nome)}" maxlength="40" placeholder="Nome da área" ${a.rem ? 'disabled' : ''}>
        <span class="acnt">${n} ${n === 1 ? 'indicador' : 'indicadores'}</span>
        ${a.rem ? `<button class="btn" data-undo="${k}">Desfazer</button>` : `<button class="mini dng" data-del="${k}" title="Excluir área">${ic('trash')}</button>`}
      </div>
      ${a.pick && !a.rem ? `<div class="picker">${ICONES_AREA.map(x => `<button class="pk ${x.v === a.icone ? 'on' : ''}" data-k="${k}" data-ic="${x.v}" title="${x.n}">${ic(x.v)}</button>`).join('')}</div>` : ''}
      ${a.rem ? `<div class="arem">${n ? `${n === 1 ? 'O indicador desta área será movido' : `Os ${n} indicadores desta área serão movidos`} para:
          <select class="sel" data-dest="${k}">${outros.map(o => `<option value="${o.j}" ${o.b === a.dest ? 'selected' : ''}>${esc(o.b.nome || '(sem nome)')}</option>`).join('')}</select>` : 'Esta área será excluída ao salvar.'}</div>` : ''}`;
    }).join('');
  }
  abrirModal({
    titulo:'Áreas<small>Tipos usados para agrupar os indicadores (Comercial, Financeiro, Produção, RH, Geral…)</small>',
    corpo:`<div id="aList" class="alist"></div>
      <button class="btn" data-anova style="margin-top:12px">${ic('plus')}<span class="t">Nova área</span></button>
      <p class="info" style="margin-top:14px">A ordem aqui é a ordem em que as áreas aparecem no painel, nos lançamentos e no relatório. Ao renomear uma área, todos os indicadores dela são atualizados.</p>`,
    rodape:`<button class="btn" data-close>Cancelar</button><button class="btn pri" data-m="salvar">Salvar áreas</button>`,
    aoAbrir:() => {
      desenhar();
      const box = document.getElementById('aList'), corpo = box.parentElement;
      corpo.addEventListener('click', e => {
        const t = e.target.closest('button'); if(!t) return;
        if(t.hasAttribute('data-anova')){
          L.push({ nome:'', icone:'tag', orig:null, rem:false, dest:null, pick:false, auto:true }); desenhar();
          box.querySelector(`[data-nome="${L.length - 1}"]`).focus(); return;
        }
        if(t.dataset.pick != null){ const a = L[+t.dataset.pick]; a.pick = !a.pick; desenhar(); return; }
        if(t.dataset.ic){ const a = L[+t.dataset.k]; a.icone = t.dataset.ic; a.auto = false; a.pick = false; desenhar(); return; }
        if(t.dataset.del != null){
          const k = +t.dataset.del;
          if(ativos().length <= 1){ toast('É preciso ter pelo menos uma área'); return; }
          if(L[k].orig == null){ L.splice(k, 1); desenhar(); return; }
          L[k].rem = true; L[k].pick = false; L[k].dest = L.find((b, j) => !b.rem && j !== k); desenhar(); return;
        }
        if(t.dataset.undo != null){ L[+t.dataset.undo].rem = false; desenhar(); }
      });
      corpo.addEventListener('input', e => {
        const k = e.target.dataset.nome; if(k == null) return;
        const a = L[+k]; a.nome = e.target.value;
        if(a.auto){ a.icone = iconePorNome(a.nome); e.target.parentElement.querySelector('.aic').innerHTML = ic(a.icone); }
      });
      corpo.addEventListener('change', e => { if(e.target.dataset.dest != null) L[+e.target.dataset.dest].dest = L[+e.target.value]; });
      // ordenar áreas arrastando
      box.addEventListener('mousedown', e => { const g = e.target.closest('.grip'); if(g) g.closest('.arow').draggable = true; });
      box.addEventListener('dragstart', e => {
        const r = e.target.closest && e.target.closest('.arow'); if(!r || !r.draggable){ e.preventDefault(); return; }
        arr = +r.dataset.k; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(arr)); setTimeout(() => r.classList.add('dragging'), 0);
      });
      box.addEventListener('dragover', e => {
        if(arr == null) return; const r = e.target.closest('.arow');
        box.querySelectorAll('.dropb,.dropa').forEach(x => x.classList.remove('dropb', 'dropa'));
        if(!r || +r.dataset.k === arr) return; e.preventDefault();
        const b = r.getBoundingClientRect(); r.classList.add(e.clientY < b.top + b.height / 2 ? 'dropb' : 'dropa');
      });
      box.addEventListener('drop', e => {
        if(arr == null) return; e.preventDefault();
        const r = box.querySelector('.dropb,.dropa'); if(r) moverArea(arr, +r.dataset.k, r.classList.contains('dropa'));
        arr = null; desenhar();
      });
      box.addEventListener('dragend', () => { arr = null; desenhar(); });
      box.addEventListener('keydown', e => {
        const g = e.target.closest('.grip'); if(!g || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
        e.preventDefault(); const k = +g.dataset.ag, j = k + (e.key === 'ArrowDown' ? 1 : -1);
        if(j < 0 || j >= L.length) return;
        const novo = moverArea(k, j, e.key === 'ArrowDown'); desenhar(); box.querySelector(`[data-ag="${novo}"]`)?.focus();
      });
    },
    acoes:{ salvar:() => {
      const kept = ativos();
      for(const a of kept){ a.nome = a.nome.trim(); if(!a.nome){ toast('Dê um nome para todas as áreas'); return; } }
      const nomes = kept.map(a => a.nome.toLowerCase());
      if(new Set(nomes).size !== nomes.length){ toast('Existem duas áreas com o mesmo nome'); return; }
      const mapa = {};
      L.forEach(a => { if(a.orig == null) return; mapa[a.orig] = a.rem ? (a.dest && !a.dest.rem ? a.dest.nome : kept[0].nome) : a.nome; });
      DB.indicadores.forEach(i => { if(mapa[i.area] != null) i.area = mapa[i.area]; });
      DB.areas = kept.map(a => ({ nome:a.nome, icone:a.icone }));
      if(mapa[EST.area] != null) EST.area = mapa[EST.area];
      if(mapa[EST.lancArea] != null) EST.lancArea = mapa[EST.lancArea];
      salvarDB(); fecharModal(); INTERNOS.find(x => x.id === atual)?.render(); toast('Áreas salvas');
    } }
  });
  // move a área "de" para antes/depois de "para" e devolve a nova posição
  function moverArea(de, para, depois){
    const item = L[de], alvo = L[para];
    L.splice(de, 1);
    const pos = L.indexOf(alvo) + (depois ? 1 : 0);
    L.splice(pos, 0, item);
    return pos;
  }
}
function modalAno(){
  const prox = String(Math.max(...anos().map(Number)) + 1);
  abrirModal({
    titulo:'Novo ano<small>Cria um novo ano para lançamento</small>',
    corpo:`<div class="fld"><label for="nAno">Ano</label><input id="nAno" type="number" min="2000" max="2100" value="${prox}"></div>
      <label class="chk"><input type="checkbox" id="nCopiar" checked> Copiar as metas de ${EST.ano}</label>`,
    rodape:`<button class="btn" data-close>Cancelar</button><button class="btn pri" data-m="criar">Criar ano</button>`,
    acoes:{ criar:() => {
      const a = String(parseInt(document.getElementById('nAno').value, 10));
      if(!/^\d{4}$/.test(a)){ toast('Ano inválido'); return; }
      if(DB.valores[a]){ toast('Esse ano já existe'); return; }
      const copiar = document.getElementById('nCopiar').checked, base = EST.ano;
      DB.valores[a] = {};
      [...DB.indicadores.map(i => i.id), GID].forEach(id => { DB.valores[a][id] = { meta:copiar ? [...vals(base, id).meta] : x12(null), real:x12(null) }; });
      EST.ano = a; EST.mes = null; salvarDB(); fecharModal(); renderLanc(); toast(`Ano ${a} criado`);
    } }
  });
}
function exportarBackup(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `indicadores-eleve-backup-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
document.getElementById('fileImport').addEventListener('change', e => {
  const f = e.target.files[0]; e.target.value = ''; if(!f) return;
  if(!admin()){ toast('Somente o administrador pode importar backup'); return; }
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if(!validoDB(d)) throw 0;
      if(!confirm(`Importar o backup "${f.name}"? Os dados atuais deste navegador serão substituídos.`)) return;
      substituirTudo(d, 'Backup importado');
    } catch(err){ toast('Arquivo de backup inválido'); }
  };
  r.readAsText(f);
});

function gerarRelatorio(o){

  const per = o.conteudo === 'anual' ? `Ano ${ano} (janeiro a dezembro)` : nomeMes(mes, ano);

    const cnt = { ok:0, atencao:0, abaixo:0, sem:0 }; res.forEach(r => cnt[r.s]++);
    const com = res.length - cnt.sem;
    const box = (l, v, s, hl) => `<div class="rp-box ${hl ? 'hl' : ''}"><small>${s ? sIcon(s) : ''}${l}</small><b>${v}</b></div>`;
    const pg = periodoGlobal(ano, mes);
    corpo += `<div class="rp-sum">${box(esc(DB.global.nome), fmtG(pg.real) + (pg.meta != null ? ` <small style="font-size:9px;font-weight:400;color:#5F6B7A">meta ${fmtG(pg.meta)}</small>` : ''), pg.a == null ? null : status(pg.a), true)}${box('Metas atingidas', com ? Math.round(cnt.ok / com * 100) + '%' : '–', null, true)}${box('Atingidos', cnt.ok, 'ok')}${box('Atenção', cnt.atencao, 'atencao')}${box('Abaixo da meta', cnt.abaixo, 'abaixo')}${box('Sem lançamento', cnt.sem, 'sem')}</div>`;
    corpo += `<table class="rp-tb"><thead><tr><th class="l">Indicador</th><th class="l">Unid.</th><th class="l">Sentido</th><th>Meta</th><th>Realizado</th><th>% Atingimento</th><th class="l">Status</th></tr></thead><tbody>`;
    { const sg = status(pg.a), w = pg.a == null ? 0 : Math.max(0, Math.min(1, pg.a)) * 100;
      corpo += `<tr class="rp-grp"><td class="l" colspan="7">${ic('gauge')}Empresa</td></tr><tr><td class="l"><b>${esc(DB.global.nome)}</b> <span style="color:#5F6B7A">(média de ${pg.n} indicadores)</span></td><td class="l">%</td><td class="l">↑ maior</td>
        <td>${fmtG(pg.meta)}</td><td><b>${fmtG(pg.real)}</b></td><td><span class="rp-bar"><i style="width:${w}%;background:${ST[sg].c}"></i></span><b>${pct(pg.a)}</b></td><td class="l">${sPill(sg)}</td></tr>`; }
    [...new Set(res.map(r => r.i.area))].forEach(a => {
      corpo += `<tr class="rp-grp"><td class="l" colspan="7">${ic(areaIcone(a))}${esc(a)}</td></tr>`;
      res.filter(r => r.i.area === a).forEach(({ i, p, s }) => {
        const w = p.a == null ? 0 : Math.max(0, Math.min(1, p.a)) * 100;
        corpo += `<tr><td class="l">${esc(i.nome)}</td><td class="l">${esc(i.unidade)}</td><td class="l">${i.direcao === 'menor' ? '↓ menor' : '↑ maior'}</td>
          <td>${fmt(p.meta, i.unidade)}</td><td>${fmt(p.real, i.unidade)}</td>
          <td><span class="rp-bar"><i style="width:${w}%;background:${ST[s].c}"></i></span><b>${pct(p.a)}</b></td><td class="l">${sPill(s)}</td></tr>`;
      });
    });
    corpo += `</tbody></table>`;
  } else {
    corpo += `<table class="rp-tb rp-ano"><thead><tr><th class="l">Indicador</th><th class="l">Linha</th>${MESES.map(m => `<th>${m}</th>`).join('')}<th>Acum.</th></tr></thead>`;
    { const vg = valsGlobal(ano), ag = periodoGlobal(ano, 'acum');
      const pcg = p => { const s = status(p.a); return `<td class="${p.a == null ? '' : 'h-' + s}">${p.a == null ? '–' : `<span class="hc">${ST[s].i}</span>${pct(p.a)}`}</td>`; };
      corpo += `<tbody class="rp-gh"><tr class="rp-grp"><td class="l" colspan="15">${ic('gauge')}Empresa</td></tr></tbody>
        <tbody><tr><td class="l rp-n" rowspan="3">${esc(DB.global.nome)}<br><span style="font-weight:400;color:#5F6B7A">% · média do atingimento · ${tetoTxt()}</span></td>
          <td class="l rp-lb">Meta <span class="rp-u">(%)</span></td>${vg.meta.map(x => `<td>${x == null ? '–' : num(x, 1)}</td>`).join('')}<td><b>${ag.meta == null ? '–' : num(ag.meta, 1)}</b></td></tr>
        <tr><td class="l rp-lb">Eficiência <span class="rp-u">(%)</span></td>${vg.real.map(x => `<td>${x == null ? '–' : num(x, 1)}</td>`).join('')}<td><b>${ag.real == null ? '–' : num(ag.real, 1)}</b></td></tr>
        <tr><td class="l rp-lb">% Ating.</td>${MESES.map((_, k) => pcg(periodoGlobal(ano, k))).join('')}${pcg(ag)}</tr></tbody>`; }

      const v = vals(ano, i.id), u = i.unidade, ac = periodo(i, ano, 'acum');
      const nC = x => x == null || isNaN(x) ? '–' : num(x);   // número completo, sem abreviar
      const pc = a => { const s = status(a); return `<td class="${a == null ? '' : 'h-' + s}">${a == null ? '–' : `<span class="hc">${ST[s].i}</span>${pct(a)}`}</td>`; };
      corpo += `<tbody><tr><td class="l rp-n" rowspan="3">${esc(i.nome)}<br><span style="font-weight:400;color:#5F6B7A">${esc(u)} · ${i.direcao === 'menor' ? '↓ menor é melhor' : '↑ maior é melhor'}</span></td>
          <td class="l rp-lb">Meta <span class="rp-u">(${esc(u)})</span></td>${v.meta.map(x => `<td>${nC(x)}</td>`).join('')}<td><b>${nC(ac.meta)}</b></td></tr>

        <tr><td class="l rp-lb">% Ating.</td>${MESES.map((_, k) => pc(atingimento(i, v.meta[k], v.real[k]))).join('')}${pc(ac.a)}</tr></tbody>`;
    });
    corpo += `</table>`;
  }
  if(!lista.length) corpo = '<p>Nenhum indicador cadastrado para esta área.</p>';
  corpo += `<div class="rp-legend"><b>Critério:</b><span>${sIcon('ok')} Atingido ≥ 100%</span><span>${sIcon('atencao')} Atenção 90–99%</span><span>${sIcon('abaixo')} Abaixo &lt; 90%</span>

    <span>${esc(DB.global.nome)} = média do atingimento de todos os indicadores da empresa (${tetoTxt()})</span></div>`;
  if(o.obs) corpo += `<div class="rp-obs"><b>Observações</b>${esc(o.obs)}</div>`;

  const rod = `<div class="rp-foot"><span>Eleve · Portal de sistemas corporativos</span><span>Painel de Indicadores de Desempenho · ${esc(per)}</span></div>`;
  rp.className = o.orient;
  rp.innerHTML = `<table class="rp-wrap"><thead><tr><td>${cab}</td></tr></thead><tbody><tr><td>${corpo}</td></tr></tbody><tfoot><tr><td>${rod}</td></tr></tfoot></table>`;
  document.getElementById('pageStyle').textContent =
    `@page{size:A4 ${o.orient};margin:10mm 10mm 12mm;@bottom-right{content:"Página " counter(page) " de " counter(pages);font:8px Arial,sans-serif;color:#5F6B7A}}`;
  const tituloOrig = document.title;
  const sufixo = o.conteudo === 'anual' ? ano : (mes === 'acum' ? 'acumulado_' + ano : ano + '-' + String(mes + 1).padStart(2, '0'));
  document.title = `Indicadores_Eleve_${sufixo}${o.area === 'todas' ? '' : '_' + o.area.replace(/\s+/g, '_')}`;
  fecharModal();
  setTimeout(() => { window.print(); document.title = tituloOrig; }, 60);
}

const modal = document.getElementById('modal'), mbox = document.getElementById('mbox');
let acoesModal = {};
function abrirModal({ titulo, corpo, rodape, acoes = {}, largo = false, aoAbrir }){
  acoesModal = acoes;
  mbox.className = 'mbox' + (largo ? ' lg' : '');
  mbox.innerHTML = `<div class="mhead"><h3>${titulo}</h3><button class="mini" data-close title="Fechar">${ic('close')}</button></div>
    <div class="mbody">${corpo}</div><div class="mfoot">${rodape}</div>`;
  modal.classList.add('show'); modal.setAttribute('aria-hidden', 'false');
  if(aoAbrir) aoAbrir(); else mbox.querySelector('.mfoot .pri')?.focus();
}
function fecharModal(){ modal.classList.remove('show'); modal.setAttribute('aria-hidden', 'true'); mbox.innerHTML = ''; tip.classList.remove('show'); }
modal.addEventListener('click', e => {
  if(e.target.closest('[data-close]')){ fecharModal(); return; }   // fecha só pelo X ou Cancelar/Fechar
  const b = e.target.closest('[data-m]'); if(b && acoesModal[b.dataset.m]) acoesModal[b.dataset.m]();
});
document.addEventListener('keydown', e => {
  if(!modal.classList.contains('show')) return;
  if(e.key === 'Escape') fecharModal();
  if(e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox' && e.target.type !== 'radio'){
    const p = mbox.querySelector('.mfoot [data-m]'); if(p){ e.preventDefault(); p.click(); }
  }
});

const tip = document.getElementById('tip');
document.addEventListener('mouseover', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if(!t){ tip.classList.remove('show'); return; }
  tip.textContent = t.getAttribute('data-tip'); tip.classList.add('show');
});
document.addEventListener('mousemove', e => {
  if(!tip.classList.contains('show')) return;
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8);
  const y = e.clientY + 18 + tip.offsetHeight > innerHeight ? e.clientY - tip.offsetHeight - 10 : e.clientY + 18;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});
let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }
