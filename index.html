   TELA INICIAL
   ===================================================================== */
const CHAVE_REC = 'portalEleveRecentes';
const todosAtalhos = () => [...INTERNOS, ...SISTEMAS];
const hGreet = document.getElementById('hGreet'), hData = document.getElementById('hData'), hHora = document.getElementById('hHora'),
      hKpi = document.getElementById('hKpi'), hRec = document.getElementById('hRec'), hBusca = document.getElementById('hBusca'), hVazio = document.getElementById('hVazio');
document.getElementById('hDeco').innerHTML = document.querySelector('.brand .sym').outerHTML.replace('class="sym"', '');
document.getElementById('hMax').textContent = todosAtalhos().length;

function registrarRecente(id){
  try { const r = JSON.parse(localStorage.getItem(CHAVE_REC) || '[]').filter(x => x !== id); r.unshift(id); localStorage.setItem(CHAVE_REC, JSON.stringify(r.slice(0, 4))); } catch(e){}
}
function saudacao(){ const h = new Date().getHours(); return h < 5 ? 'Boa noite' : h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite'; }
function relogio(){
  const d = new Date(), dt = d.toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
  hGreet.innerHTML = `${saudacao()}!<br><span>O que vamos acompanhar hoje?</span>`;
  hData.textContent = dt.charAt(0).toUpperCase() + dt.slice(1);
  hHora.textContent = d.toLocaleTimeString('pt-BR', { hour:'2-digit', minute:'2-digit' });
}
function renderHome(){
  relogio();
  garantirAno();
  const ano = EST.ano, mes = EST.mes;
  const sts = DB.indicadores.map(i => status(periodo(i, ano, mes).a));
  const cnt = { ok:0, atencao:0, abaixo:0, sem:0 }; sts.forEach(s => cnt[s]++);
  const tot = sts.length, com = tot - cnt.sem;
  // anel com a distribuição de status
  const R = 46, C = 2 * Math.PI * R; let off = 0, segs = '';
  ['ok', 'atencao', 'abaixo', 'sem'].forEach(s => {
    if(!cnt[s]) return; const len = cnt[s] / tot * C, gap = cnt[s] < tot ? 2.5 : 0;
    segs += `<circle cx="58" cy="58" r="${R}" fill="none" stroke="${ST[s].c}" stroke-width="12" stroke-dasharray="${Math.max(len - gap, 1)} ${C}" stroke-dashoffset="${-off}"/>`;
    off += len;
  });
  hKpi.innerHTML = `<button class="hk" data-open="indicadores" style="--i:3" title="Abrir painel de indicadores">
    <div class="hk-h">${ic('gauge')}Desempenho · ${esc(nomeMes(mes, ano))}</div>
    <div class="hk-b">
      <div class="hk-ring"><svg viewBox="0 0 116 116"><circle cx="58" cy="58" r="${R}" fill="none" style="stroke:var(--border)" stroke-width="12"/>${segs}</svg>
        <div><b>${com ? Math.round(cnt.ok / com * 100) + '%' : '–'}</b><small>metas<br>atingidas</small></div></div>
      <div class="hk-l">${['ok', 'atencao', 'abaixo', 'sem'].map(s => `<div>${sIcon(s)}${ST[s].n}<b>${cnt[s]}</b></div>`).join('')}</div>
    </div>
    ${(g => `<div class="hk-g">${ic('gauge')}<span>${esc(DB.global.nome)}${g.meta != null ? `<br><small>meta ${fmtG(g.meta)}</small>` : ''}</span><b style="color:${g.a == null ? 'var(--txt)' : ST[status(g.a)].c}">${fmtG(g.real)}</b></div>`)(periodoGlobal(ano, mes))}
    <div class="hk-f">${tot} ${tot === 1 ? 'indicador monitorado' : 'indicadores monitorados'}<span>Ver painel ${ic('arrow')}</span></div>
  </button>`;
  // resumo nos cards de indicadores
  let ult = -1; DB.indicadores.forEach(i => vals(ano, i.id).real.forEach((x, k) => { if(x != null && k > ult) ult = k; }));
  const fp = home.querySelector('[data-fs="indicadores"]'), fl = home.querySelector('[data-fs="lancamentos"]');
  const eg = periodoGlobal(ano, mes);
  if(fp) fp.innerHTML = tot ? `${eg.real == null ? '' : `<span>Eficiência ${fmtG(eg.real)}</span>`}<span>${sIcon('ok')}${cnt.ok} atingidos</span><span>${sIcon('atencao')}${cnt.atencao} atenção</span><span>${sIcon('abaixo')}${cnt.abaixo} abaixo</span>` : '';
  if(fl) fl.innerHTML = `<span>${tot} indicadores</span><span>${areas().length} áreas</span>${ult >= 0 ? `<span>Último realizado: ${MESES[ult]}/${ano}</span>` : ''}`;
  // sistemas já abertos (em memória)
  home.querySelectorAll('.card').forEach(c => c.classList.toggle('on', !!iframes[c.dataset.id]));
  // acessados recentemente
  let rec = []; try { rec = JSON.parse(localStorage.getItem(CHAVE_REC) || '[]'); } catch(e){}
  const itens = rec.map(id => todosAtalhos().find(x => x.id === id)).filter(Boolean);
  hRec.innerHTML = itens.length ? `<span>${ic('clock')}Continuar de onde parou</span>` + itens.map(s => `<button class="rchip" data-open="${s.id}">${ic(s.icone)}${esc(s.nome)}</button>`).join('') : '';
}
function filtrarHome(){
  const q = normTxt(hBusca.value.trim()); let vis = 0;
  home.querySelectorAll('.card').forEach(c => { const ok = !q || c.dataset.busca.includes(q); c.classList.toggle('hid', !ok); if(ok) vis++; });
  home.querySelectorAll('h2.hsec').forEach(h => { const g = h.nextElementSibling, tem = !!g.querySelector('.card:not(.hid)'); h.style.display = g.style.display = tem ? '' : 'none'; });
  hVazio.classList.toggle('show', !vis);
}
home.addEventListener('click', e => { const b = e.target.closest('[data-open]'); if(b) abrir(b.dataset.open); });
hBusca.addEventListener('input', filtrarHome);
hBusca.addEventListener('keydown', e => {
  if(e.key === 'Enter'){ const c = home.querySelector('.card:not(.hid)'); if(c){ e.preventDefault(); abrir(c.dataset.id); } }
  if(e.key === 'Escape'){ hBusca.value = ''; filtrarHome(); hBusca.blur(); }
});
document.addEventListener('keydown', e => {
  if(!home.classList.contains('show') || modal.classList.contains('show')) return;
  if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); hBusca.focus(); hBusca.select(); return; }
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key === '/'){ e.preventDefault(); hBusca.focus(); return; }
  const n = +e.key, lista = todosAtalhos(); if(n >= 1 && n <= lista.length) abrir(lista[n - 1].id);
});
setInterval(() => { if(home.classList.contains('show')) relogio(); }, 20000);

// Abre a tela indicada na URL (#indicadores, #lancamentos, #rh, #financeiro...) ou a tela inicial
atualizarCadeado();
if(SYNC.on){ setEstado('carr'); verificar(true); } else setEstado('loc');
const inicial = location.hash.slice(1);
abrir(SISTEMAS.some(s => s.id === inicial) || INTERNOS.some(s => s.id === inicial) ? inicial : 'home');
</script>
</body>
</html>
